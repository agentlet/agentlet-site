name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Build the agentlet-demos package
        run: npm run build:known-sites

      - name: Check that the package would publish cleanly
        working-directory: packages/agentlet-demos
        run: npm pack --dry-run

      - name: Check built pages for forbidden characters
        run: node scripts/check-typography.mjs dist

      - name: Check internal links in built pages
        run: node scripts/check-links.mjs dist

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e
