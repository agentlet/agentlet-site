name: Publish @agentlet/demos

# Publishes packages/agentlet-demos to npm when a tag named demos-v<version> is
# pushed. Nothing here runs on a normal push or pull request: the regular
# build workflow (build.yml) builds the package on every push to catch
# breakage, but never publishes it.

on:
  push:
    tags:
      - 'demos-v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Attaches the SBOM to the GitHub release of the tag.
      contents: write
      # Lets npm authenticate with a short-lived OIDC token (trusted
      # publishing, no NPM_TOKEN secret) and sign a provenance statement.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Check that the tag matches the package version
        run: |
          version="$(node -p "require('./packages/agentlet-demos/package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "demos-v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match packages/agentlet-demos/package.json version ${version} (expected demos-v${version})."
            exit 1
          fi
          echo "DEMOS_VERSION=${version}" >> "${GITHUB_ENV}"

      - name: Build the package
        run: npm run build:known-sites

      - name: List the package metafiles
        id: metafiles
        run: |
          set -euo pipefail
          if ! ls reports/security/meta/known-sites/*.meta.json >/dev/null 2>&1; then
            echo "::error::The package build wrote no metafile."
            exit 1
          fi
          {
            echo 'list<<EOF'
            ls reports/security/meta/known-sites/*.meta.json
            echo 'EOF'
          } >> "${GITHUB_OUTPUT}"

      - name: Build the SBOM of the package
        id: sbom
        # The package is a set of esbuild bundles, so a filesystem scan of
        # dist/ finds no dependency. The metafiles (written outside dist/)
        # list what was bundled.
        uses: agentlet/.github/actions/sbom-from-esbuild@13f8b012ab7b0e07229389ac7538bdab38cdb4e6 # dependency-scan-v1
        with:
          metafiles: ${{ steps.metafiles.outputs.list }}
          name: '@agentlet/demos'
          version: ${{ env.DEMOS_VERSION }}
          output: reports/security/sbom-demos.cdx.json

      - name: Scan the bundled dependencies
        # Blocks the publish: a vulnerable bundled dependency must not reach
        # npm or jsDelivr. The lockfile is covered by the Security workflow.
        uses: agentlet/.github/actions/dependency-scan@13f8b012ab7b0e07229389ac7538bdab38cdb4e6 # dependency-scan-v1
        with:
          blocking-sbom: ${{ steps.sbom.outputs.sbom-path }}
          lockfile: ''
          fail-on-gate: 'true'
          upload-sarif: 'false'
          report-dir: reports/security/publish
          artifact-name: demos-publish-scan-reports

      - name: Upgrade npm for staged trusted publishing
        # Staged publishing needs npm 11.15.0 or later, trusted publishing
        # (OIDC) needs npm 11.5.1 or later, and both need Node 22.14.0 or
        # later. Upgrade right before it is needed and fail clearly otherwise.
        run: |
          npm install -g 'npm@^11.15.0'
          npm_version="$(npm --version)"
          echo "npm ${npm_version}, node $(node --version)"
          if [ "$(printf '%s\n' 11.15.0 "$npm_version" | sort -V | head -n 1)" != "11.15.0" ]; then
            echo "npm ${npm_version} is older than 11.15.0, staged publishing is not available." >&2
            exit 1
          fi

      - name: Stage the package on npm
        # No NODE_AUTH_TOKEN and no NPM_TOKEN: npm exchanges the job's OIDC
        # identity for a short-lived token, using the trusted publisher
        # configured on npmjs.com for @agentlet/demos (organization agentlet,
        # repository agentlet-site, workflow publish-demos.yml). It may only
        # stage: the version becomes public once a maintainer approves it
        # with 2FA. --provenance stays so that staging fails instead of going
        # out without an attestation.
        working-directory: packages/agentlet-demos
        run: |
          set -euo pipefail
          npm stage publish --access public --provenance | tee "${RUNNER_TEMP}/stage-output.txt"
          {
            echo "### @agentlet/demos ${DEMOS_VERSION} is staged on npm, not yet public"
            echo
            echo "Approve it with 2FA on npmjs.com (package @agentlet/demos, Staged Packages tab),"
            echo "or with \`npm stage list @agentlet/demos\` then \`npm stage approve <stage-id>\`."
            echo
            echo '```'
            cat "${RUNNER_TEMP}/stage-output.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attach the SBOM to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          SBOM_SOURCE: ${{ steps.sbom.outputs.sbom-path }}
        run: |
          set -euo pipefail
          asset="agentlet-demos-${DEMOS_VERSION}.cdx.json"
          cp "${SBOM_SOURCE}" "${asset}"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${asset}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${asset}" --verify-tag --title "${GITHUB_REF_NAME}" --generate-notes
          fi
